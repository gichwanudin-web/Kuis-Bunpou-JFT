<html lang="id">

        .question-text {
            font-size: 1.05rem;

            line-height: 1.9;
            margin-bottom: 25px;
            padding: 20px;
            background: #f9f8ff;
            border-left: 5px solid #764ba2;
            border-radius: 10px;
            min-height: 100px;
            white-space: pre-wrap;

        .speaker-b { color: #1e8449; font-weight: 600; }

            margin-top: 10px;

        .result-message {

    </style>
</head>
<body>
<div class="container">
    <h1>📝 文法 (ぶんぽう) テスト 2</h1>

    <div id="startScreen">
        <label for="nama">Nama Lengkap</label>

        <label for="kelas">Kelas</label>
        <input type="text" id="kelas" placeholder="Masukkan kelas Anda" required>
        <button class="btn" id="startBtn" onclick="startQuiz()">Mulai Kuis</button>
    </div>

    <div id="quizScreen">
        <div class="top-bar">
            <span class="badge" id="questionCounter">Soal 1 / 74</span>

        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <div class="nav-buttons">
            <button class="btn secondary" id="prevBtn" onclick="prevQuestion()">← Sebelumnya</button>
            <button class="btn" id="nextBtn" onclick="nextQuestion()">Selanjutnya →</button>
        </div>
    </div>

    <div id="resultScreen">
        <h2>🎉 Kuis Selesai!</h2>

        <div class="result-detail" id="resultNama"></div>
        <div class="result-detail" id="resultKelas"></div>
        <div class="result-detail" id="resultDetail"></div>
        <div class="result-message" id="resultMessage"></div>
        <div class="review-section" id="reviewSection"></div>
        <button class="btn" onclick="location.reload()">Ulangi Kuis</button>
    </div>
</div>

// ==================== VARIABEL GLOBAL ====================
let currentQuestions = [];
let userAnswers = [];
let currentIndex = 0;
let userName = "";
let userClass = "";
let timerInterval = null;
let timeLeft = 45 * 60;

// ==================== FUNGSI ACAK ====================
function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// ==================== MULAI KUIS ====================
function startQuiz() {
    const namaInput = document.getElementById('nama').value.trim();
    const kelasInput = document.getElementById('kelas').value.trim();

    if (!namaInput || !kelasInput) {
        alert('Silakan isi Nama dan Kelas terlebih dahulu!');
        return;
    }

    userName = namaInput;
    userClass = kelasInput;

    currentQuestions = shuffleArray(questionsData);

    currentQuestions = currentQuestions.map(q => {
        const correctText = q.options[q.correct];
        const shuffledOptions = shuffleArray(q.options);
        const newCorrectIndex = shuffledOptions.indexOf(correctText);
        return {
            q: q.q,
            options: shuffledOptions,
            correct: newCorrectIndex
        };
    });

    userAnswers = new Array(currentQuestions.length).fill(null);
    currentIndex = 0;

    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('quizScreen').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    
    // Update jumlah soal di badge
    document.getElementById('questionCounter').textContent = `Soal 1 / ${currentQuestions.length}`;

    timeLeft = 45 * 60;
    startTimer();
    renderQuestion();
}

// ==================== TIMER ====================
function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    const display = document.getElementById('timerDisplay');
    display.textContent = `⏱ ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    if (timeLeft <= 450) {
        display.classList.add('warning');
    } else {
        display.classList.remove('warning');
    }
}

// ==================== RENDER SOAL ====================
function renderQuestion() {
    const q = currentQuestions[currentIndex];
    const total = currentQuestions.length;

    document.getElementById('questionCounter').textContent = `Soal ${currentIndex + 1} / ${total}`;
    const progress = ((currentIndex + 1) / total) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('questionText').innerHTML = q.q;

    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D'];

    q.options.forEach((opt, idx) => {
        const div = document.createElement('div');
        div.className = 'option';
        if (userAnswers[currentIndex] === idx) {
            div.classList.add('selected');
        }
        div.innerHTML = `
            <span class="letter">${letters[idx]}</span>
            <span>${opt}</span>
        `;
        div.onclick = () => selectOption(idx);
        optionsContainer.appendChild(div);
    });

    document.getElementById('prevBtn').disabled = currentIndex === 0;
    const nextBtn = document.getElementById('nextBtn');
    if (currentIndex === total - 1) {
        nextBtn.textContent = 'Selesai ✓';
    } else {
        nextBtn.textContent = 'Selanjutnya →';
    }
}

// ==================== PILIH OPSI ====================
function selectOption(idx) {
    userAnswers[currentIndex] = idx;
    const options = document.querySelectorAll('.option');
    options.forEach((opt, i) => {
        if (i === idx) {
            opt.classList.add('selected');
        } else {
            opt.classList.remove('selected');
        }
    });
}

// ==================== NAVIGASI ====================
function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function nextQuestion() {
    if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        finishQuiz();
    }
}

// ==================== SELESAI KUIS ====================
function finishQuiz() {
    if (timerInterval) clearInterval(timerInterval);

    let correctCount = 0;
    currentQuestions.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
            correctCount++;
        }
    });

    const total = currentQuestions.length;
    const score = Math.round((correctCount / total) * 100);

    document.getElementById('quizScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';

    document.getElementById('scoreDisplay').textContent = score;
    document.getElementById('resultNama').innerHTML = `Nama: <strong>${userName}</strong>`;
    document.getElementById('resultKelas').innerHTML = `Kelas: <strong>${userClass}</strong>`;
    document.getElementById('resultDetail').innerHTML = `Jawaban Benar: <strong>${correctCount}</strong> / ${total}`;

    let message = '';
    if (score >= 90) message = '🌟 Luar biasa! Anda sangat memahami materi ini.';
    else if (score >= 80) message = '😊 Bagus sekali! Pertahankan ya.';
    else if (score >= 70) message = '👍 Cukup baik. Sedikit lagi belajar.';
    else if (score >= 60) message = '📖 Perlu belajar lagi. Jangan menyerah!';
    else message = '💪 Ayo semangat belajar! Ulangi lagi ya.';

    document.getElementById('resultMessage').textContent = message;

    // Review jawaban
    const reviewSection = document.getElementById('reviewSection');
    reviewSection.innerHTML = '<h3 style="color:#4a3f8a; margin-bottom:10px;">📋 Review Jawaban</h3>';
    currentQuestions.forEach((q, idx) => {
        const isCorrect = userAnswers[idx] === q.correct;
        const userAns = userAnswers[idx] !== null ? q.options[userAnswers[idx]] : '(tidak dijawab)';
        const correctAns = q.options[q.correct];
        const div = document.createElement('div');
        div.className = 'review-item ' + (isCorrect ? 'correct' : 'wrong');
        div.innerHTML = `
            <span class="q-num">Soal ${idx + 1}:</span> ${q.q.replace(/<[^>]*>/g, '').substring(0, 60)}...<br>
            <strong>Jawaban Anda:</strong> ${userAns} ${isCorrect ? '✅' : '❌'}<br>
            ${!isCorrect ? `<strong>Jawaban Benar:</strong> ${correctAns}` : ''}
        `;
        reviewSection.appendChild(div);
    });
}
